name: Fetch news and prices

on:
  schedule:
    # 09:20 and 23:20 Sydney. Both UTC offsets are listed (AEDT +11 / AEST +10);
    # tools/slot.py skips whichever one lands outside the Sydney fetch window.
    - cron: "20 22,23 * * *"
    - cron: "20 12,13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch now, even outside the 09:20 / 23:20 window"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Sydney time window
        id: window
        run: |
          if [ "${{ inputs.force }}" = "true" ] || python tools/slot.py check fetch; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch feeds
        if: steps.window.outputs.go == 'true'
        run: python tools/fetch_feeds.py
      - name: Fetch prices
        if: steps.window.outputs.go == 'true'
        run: python tools/fetch_prices.py
      - name: Commit
        if: steps.window.outputs.go == 'true'
        run: |
          git config user.name "geopol-bot"
          git config user.email "geopol-bot@users.noreply.github.com"
          git add data/inbox data/prices
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: fetch $(python tools/slot.py current)"
          git pull --rebase
          git push
